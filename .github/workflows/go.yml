name: Go

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.ceph-release }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - ceph-release: squid
            runner: ubuntu-24.04
          - ceph-release: tentacle
            runner: ubuntu-26.04
    runs-on: ${{ matrix.runner }}

    env:
      RESTIC_VERSION: "0.19.0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ceph-mon ceph-osd librados-dev libradosstriper-dev

      - name: Print Ceph version
        run: ceph --version

      - name: Install restic
        run: |
          set -o xtrace
          curl --location https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2 --output restic_${RESTIC_VERSION}_linux_amd64.bz2
          bunzip2 restic_${RESTIC_VERSION}_linux_amd64.bz2
          chmod +x restic_${RESTIC_VERSION}_linux_amd64
          sudo mv restic_${RESTIC_VERSION}_linux_amd64 /usr/local/bin/restic

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build
        run: |
          go build

      - name: Test
        timeout-minutes: 25
        run: |
          go test -timeout 20m
