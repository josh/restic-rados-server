{{- include "restic-rados-server.validate" . -}}
{{- if .Values.networkPolicy.enabled }}
{{- $ingress := list }}
{{- if not .Values.services }}
{{- $ingressFrom := dig "ingressFrom" (list) .Values.networkPolicy }}
{{- with $ingressFrom }}
{{- $ports := list (dict "protocol" "TCP" "port" (include "restic-rados-server.httpPort" $ | int)) }}
{{- $ingress = append $ingress (dict "from" . "ports" $ports) }}
{{- end }}
{{- $rawIngress := dig "ingress" (list) .Values.networkPolicy }}
{{- $ingress = concat $ingress $rawIngress }}
{{- end }}
{{- $configuredEgress := dig "egress" (dict) .Values.networkPolicy }}
{{- $egressDefaults := include "restic-rados-server.networkPolicyEgressDefaults" . | fromYaml }}
{{- $egressConfig := mergeOverwrite $egressDefaults $configuredEgress }}
{{- if $egressConfig.enabled }}
{{- $egressConfig = $configuredEgress }}
{{- end }}
{{- $egressEnabled := $egressConfig.enabled }}
{{- $egress := list }}
{{- if $egressEnabled }}
{{- if $egressConfig.dns.enabled }}
{{- $ports := list (dict "protocol" "TCP" "port" 53) (dict "protocol" "UDP" "port" 53) }}
{{- $rule := dict "ports" $ports }}
{{- with $egressConfig.dns.to }}
{{- $_ := set $rule "to" . }}
{{- end }}
{{- $egress = append $egress $rule }}
{{- end }}
{{- if $egressConfig.ceph.monitors.enabled }}
{{- $ports := list }}
{{- range $port := $egressConfig.ceph.monitors.ports }}
{{- $ports = append $ports (dict "protocol" "TCP" "port" (atoi (toString $port))) }}
{{- end }}
{{- $rule := dict "ports" $ports }}
{{- with $egressConfig.ceph.monitors.to }}
{{- $_ := set $rule "to" . }}
{{- end }}
{{- $egress = append $egress $rule }}
{{- end }}
{{- if $egressConfig.ceph.osds.enabled }}
{{- $portRange := $egressConfig.ceph.osds.portRange }}
{{- $ports := list (dict "protocol" "TCP" "port" (atoi (toString $portRange.from)) "endPort" (atoi (toString $portRange.to))) }}
{{- $rule := dict "ports" $ports }}
{{- with $egressConfig.ceph.osds.to }}
{{- $_ := set $rule "to" . }}
{{- end }}
{{- $egress = append $egress $rule }}
{{- end }}
{{- $egress = concat $egress $egressConfig.rules }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restic-rados-server.networkPolicyName" . }}
  labels:
    {{- include "restic-rados-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restic-rados-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $egressEnabled }}
    - Egress
    {{- end }}
  {{- if $ingress }}
  ingress:
    {{- toYaml $ingress | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  {{- if $egressEnabled }}
  {{- if $egress }}
  egress:
    {{- toYaml $egress | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
  {{- end }}
{{- range $name, $service := .Values.services }}
{{- $ingressFrom := dig "networkPolicy" "ingressFrom" (list) $service }}
{{- with $ingressFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "restic-rados-server.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "restic-rados-server.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "restic-rados-server.selectorLabels" $ | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ int $service.targetPort }}
{{- end }}
{{- end }}
{{- end }}
