image:
  repository: ghcr.io/josh/restic-rados-server
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Replicas coordinate through Ceph and restic's own locking protocol, so
# scaling beyond 1 replica is safe.
replicaCount: 1

# Ceph cluster connectivity. Rendered into the ceph.conf in the chart's
# ConfigMap and injected into the server config as ceph_conf/keyring/client_id.
ceph:
  # Cluster fsid (optional).
  clusterID: ""
  # mon_host entries, e.g. [mon.ceph.svc.cluster.local]. Needed for a working
  # deploy so the chart-managed ceph.conf can reach the cluster; leave empty
  # when bringing your own Ceph config.
  monitors: []
  # Ceph client name, e.g. "restic" authenticates as client.restic.
  clientID: ""
  # Existing Secret holding a Ceph keyring file. The chart never creates
  # Secrets; create it yourself (sealed-secrets, External Secrets, sops,
  # kubectl, ...). The keyring is mounted at /etc/ceph/ceph.keyring. Leave
  # secret.name empty to skip it.
  keyring:
    secret:
      name: ""
    key: keyring

# Application config. Maps 1:1 to restic-rados-server's JSON config schema.
# The chart injects ceph_conf, keyring, and client_id at template time from
# the `ceph` block above — do not set them here.
config:
  listen:
    - "0.0.0.0:8000"
  # Configure one or more repos, each with its pool assignments, e.g.
  #   repos:
  #     default:
  #       pools:
  #         restic_data: [data, index]
  #         restic_metadata: ["*"]
  # Left empty so the chart renders without required values; add your own repos
  # for a working deploy.
  repos: {}

service:
  type: ClusterIP
  port: 8000

# Prometheus metrics, off by default. Setting enabled: true adds a
# chart-managed internal `metrics` ClusterIP Service: a listener on `port`
# that serves /metrics plus the repo API at read-only access, with
# reachability governed by NetworkPolicy (add your monitoring namespace to
# networkPolicy.ingressFrom). A services entry can instead mount metrics on
# its own listener by setting `metrics: /metrics`; any entry that configures
# metrics itself (or is named `metrics`) replaces the chart-managed one.
metrics:
  enabled: false
  port: 9925
  networkPolicy:
    ingressFrom: []

# Annotate the pod with prometheus.io/scrape and prometheus.io/port (and
# prometheus.io/path for a non-default path) whenever metrics are served.
prometheusScrape: false

# Requires the Prometheus Operator CRDs and served metrics. The instance label
# is set to the release name so several releases can share one dashboard.
# jobLabel names a Service label to use for the Prometheus job; empty uses the
# Operator's Service-name default. Selects Services labeled
# app.kubernetes.io/component: metrics, which the chart applies to every
# metrics-serving Service it renders.
serviceMonitor:
  enabled: false
  jobLabel: app.kubernetes.io/name
  interval: ""
  scrapeTimeout: ""
  labels: {}
  relabelings: []
  metricRelabelings: []

# Optional chart-managed listeners and Services. When non-empty, this map
# replaces config.listen in the rendered server configuration. Each key is
# appended to the release fullname and must be a DNS label no longer than 61
# characters; default-deny is reserved. targetPort is the unique TCP port the
# pod listens on; port is the Service port and defaults to targetPort; access
# defaults to rw; type defaults to service.type. annotations are copied to the
# generated Service, and
# networkPolicy.ingressFrom accepts a list of Kubernetes NetworkPolicyPeer
# objects. For example:
# services:
#   rw:
#     port: 8000
#     targetPort: 8000
#     access: rw
#     networkPolicy:
#       ingressFrom:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: backup-jobs
#   ro:
#     port: 8000
#     targetPort: 8001
#     access: r
#     networkPolicy:
#       ingressFrom:
#         - namespaceSelector:
#             matchLabels:
#               kubernetes.io/metadata.name: restore-jobs
services: {}

networkPolicy:
  enabled: true
  ingressFrom: []
  ingress: []
  egress:
    enabled: false
    dns:
      enabled: true
      to: []
    ceph:
      monitors:
        enabled: true
        to: []
        ports:
          - 3300
          - 6789
      osds:
        enabled: true
        to: []
        portRange:
          from: 6800
          to: 7568
    rules: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The server holds 16MiB read and write buffers per in-flight transfer.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
